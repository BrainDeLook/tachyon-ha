name: Build add-on images

on:
  push:
    branches: [master]
    paths:
      - "tachyon/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_arch: amd64
            image_arch: amd64
            runner: ubuntu-24.04
          - build_arch: aarch64
            image_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and publish add-on image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.build_arch }}
          context: ./tachyon
          file: ./tachyon/Dockerfile
          image: ghcr.io/braindelook/tachyon-ha-${{ matrix.image_arch }}
          image-tags: |
            4.2.29
            latest
          version: 4.2.29
          push: "true"
          cosign: "false"
          cache-gha: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=ghcr.io/kimusan/tachyon:latest

      - name: Smoke test Ingress and persistent settings
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/braindelook/tachyon-ha-${{ matrix.image_arch }}:4.2.29"
          old_image="ghcr.io/braindelook/tachyon-ha-${{ matrix.image_arch }}:4.2.21"
          legacy_volume="$(docker volume create)"
          data_volume="$(docker volume create)"
          trap 'docker logs tachyon-ingress-smoke 2>/dev/null || true; docker rm -f tachyon-ingress-smoke tachyon-ingress-smoke-old 2>/dev/null || true; docker volume rm "$legacy_volume" "$data_volume"' EXIT
          docker run -d --name tachyon-ingress-smoke-old -v "$legacy_volume:/var/lib/tachyon" -p 127.0.0.1:18889:8888 "$old_image"
          old_ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output "$RUNNER_TEMP/tachyon-old-page" \
              -H 'X-Ingress-Path: /api/hassio_ingress/testtoken' \
              http://127.0.0.1:18889/; then
              old_ready=true
              break
            fi
            sleep 2
          done
          test "$old_ready" = true
          curl --silent --fail --output "$RUNNER_TEMP/tachyon-old-cached-page" \
            -H 'X-Ingress-Path: /api/hassio_ingress/testtoken' \
            http://127.0.0.1:18889/
          grep -Fq '<!--cached-->' "$RUNNER_TEMP/tachyon-old-cached-page"
          docker exec tachyon-ingress-smoke-old sh -c 'printf retained > /var/lib/tachyon/ha-legacy-persistence-test'
          docker rm -f tachyon-ingress-smoke-old
          docker run -d --name tachyon-ingress-smoke -v "$legacy_volume:/var/lib/tachyon" -v "$data_volume:/data" -p 127.0.0.1:18888:8888 "$image"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --dump-header "$RUNNER_TEMP/tachyon-headers" \
              --output "$RUNNER_TEMP/tachyon-page" \
              -H 'X-Ingress-Path: /api/hassio_ingress/testtoken' \
              http://127.0.0.1:18888/; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          if grep -Fq '<!--cached-->' "$RUNNER_TEMP/tachyon-page"; then
            echo 'Old cached index survived add-on version change' >&2
            exit 1
          fi
          grep -Fq '/api/hassio_ingress/testtoken/tachyon/v/' "$RUNNER_TEMP/tachyon-page"
          grep -Fq 'Home Assistant Ingress reserializes query parameters' "$RUNNER_TEMP/tachyon-page"
          grep -Fq 'home-assistant/subscribe-properties' "$RUNNER_TEMP/tachyon-page"
          grep -Fq 'const ingressApp = true;' "$RUNNER_TEMP/tachyon-page"
          TACHYON_RENDERED_PAGE="$RUNNER_TEMP/tachyon-page" node --test tachyon/tests/*.test.cjs
          grep -Fq "frame-ancestors 'self'" "$RUNNER_TEMP/tachyon-headers"
          if grep -qi '^x-frame-options:' "$RUNNER_TEMP/tachyon-headers"; then
            echo 'Ingress page still denies iframe embedding' >&2
            exit 1
          fi
          docker exec tachyon-ingress-smoke grep -Fqx retained /data/tachyon/ha-legacy-persistence-test
          docker exec tachyon-ingress-smoke sh -c 'printf retained > /data/tachyon/ha-new-persistence-test'
          docker exec tachyon-ingress-smoke php -r '
            $path = "/data/tachyon/_data_/_default_/domains/gmail.com.json";
            $domain = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            foreach (["IMAP", "SMTP", "Sieve"] as $service) {
              $settings = $domain[$service] ?? [];
              if (!is_string($settings["host"] ?? null)
                  || !is_int($settings["port"] ?? null)
                  || !is_int($settings["type"] ?? null)) {
                throw new RuntimeException("Incomplete {$service} connection settings");
              }
            }
            if ($domain["Sieve"]["enabled"] !== false) {
              throw new RuntimeException("Gmail Sieve must remain disabled");
            }
          '
          docker rm -f tachyon-ingress-smoke
          docker run -d --name tachyon-ingress-smoke -v "$data_volume:/data" -p 127.0.0.1:18888:8888 "$image"
          restarted=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:18888/; then
              restarted=true
              break
            fi
            sleep 2
          done
          test "$restarted" = true
          docker exec tachyon-ingress-smoke grep -Fqx retained /data/tachyon/ha-legacy-persistence-test
          docker exec tachyon-ingress-smoke grep -Fqx retained /data/tachyon/ha-new-persistence-test

  lint:
    name: Validate add-on metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./tachyon
      - name: Test Ingress browser integration
        run: node --test tachyon/tests/*.test.cjs
