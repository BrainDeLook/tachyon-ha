name: Build add-on images

on:
  push:
    branches: [master]
    paths:
      - "tachyon/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_arch: amd64
            image_arch: amd64
            runner: ubuntu-24.04
          - build_arch: aarch64
            image_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and publish add-on image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.build_arch }}
          context: ./tachyon
          file: ./tachyon/Dockerfile
          image: ghcr.io/braindelook/tachyon-ha-${{ matrix.image_arch }}
          image-tags: |
            4.2.13
            latest
          version: 4.2.13
          push: "true"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=ghcr.io/kimusan/tachyon:latest

  lint:
    name: Validate add-on metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./tachyon
