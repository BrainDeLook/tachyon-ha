name: Tachyon
version: "4.2.29"
slug: tachyon
description: Modern self-hosted webmail client for Home Assistant
url: https://github.com/kimusan/Tachyon
image: ghcr.io/braindelook/tachyon-ha-{arch}
startup: services
init: false
arch:
  - amd64
  - aarch64
panel_icon: mdi:email-fast
panel_title: Tachyon
panel_admin: false
ingress: true
ingress_port: 8888
ingress_entry: /
backup_exclude:
  - "**/cache/"
  - "**/log/"
options:
  debug: false
  upload_max_size: 25M
  memory_limit: 128M
  secure_cookies: false
  preconfigure_gmail: true
schema:
  debug: bool
  upload_max_size: str
  memory_limit: str
  secure_cookies: bool
  preconfigure_gmail: bool
